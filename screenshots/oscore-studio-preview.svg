<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="700" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="500" y1="0" x2="500" y2="700" />
    <line x1="700" y1="0" x2="700" y2="700" />
    <line x1="900" y1="0" x2="900" y2="700" />
    <line x1="1100" y1="0" x2="1100" y2="700" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Header Banner -->
  <rect x="50" y="40" width="1100" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="95" cy="85" r="24" fill="#00E5FF" opacity="0.15" />
  <text x="95" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00E5FF" text-anchor="middle">🛡️</text>
  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">OSCOREForge <tspan fill="#00E5FF">Pro</tspan></text>
  <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">RFC 8613 Constrained Security Studio, Option 9 Codec &amp; 10-Point Normative Auditor</text>

  <!-- Status badges -->
  <rect x="850" y="68" width="110" height="32" rx="16" fill="#00E5FF" opacity="0.1" stroke="#00E5FF" stroke-width="1" />
  <text x="905" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">RFC 8613</text>
  <rect x="975" y="68" width="145" height="32" rx="16" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1" />
  <text x="1047" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">AUDIT: 10/10 PASS</text>

  <!-- Left Card: Security Context & Derivation -->
  <rect x="50" y="150" width="535" height="500" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="80" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">HKDF Security Context &amp; Key Separation</text>

  <!-- Context Params Box -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="475" height="130" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="15" y="28" font-family="monospace" font-size="12" fill="#94a3b8">Master Secret: <tspan fill="#00E5FF">01 02 03 04 05 06 07 08 09 0a 0b 0c 0d 0e 0f 10</tspan></text>
    <text x="15" y="52" font-family="monospace" font-size="12" fill="#94a3b8">Master Salt:   <tspan fill="#7C4DFF">9e 7c a9 22 23 78 63 40</tspan></text>
    <text x="15" y="76" font-family="monospace" font-size="12" fill="#94a3b8">Sender ID:     <tspan fill="#f59e0b">0x01</tspan> | Recipient ID: <tspan fill="#64748b">(peer)</tspan></text>
    <text x="15" y="100" font-family="monospace" font-size="12" fill="#94a3b8">ID Context:    <tspan fill="#10b981">37 cb f3 21 00 17 a2 d3</tspan> (Kid Context)</text>
    <text x="15" y="120" font-family="monospace" font-size="11" fill="#38bdf8">Algorithm:     AES-CCM-16-64-128 (COSE 10) | KDF: HKDF-SHA-256</text>
  </g>

  <!-- Derived Keys Box -->
  <text x="80" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">Derived AEAD Parameters:</text>
  <g transform="translate(80, 395)">
    <rect x="0" y="0" width="475" height="100" rx="8" fill="#090d16" stroke="#1e293b" />
    <text x="15" y="28" font-family="monospace" font-size="12" fill="#cbd5e1">Sender Key: <tspan fill="#facc15">7e914a82b3d1f0449a8820c4e1208a01</tspan></text>
    <text x="15" y="54" font-family="monospace" font-size="12" fill="#cbd5e1">Common IV:  <tspan fill="#facc15">2a688b7762d091e704b281f9ca</tspan> (13 Bytes)</text>
    <text x="15" y="80" font-family="monospace" font-size="12" fill="#cbd5e1">AEAD Nonce: <tspan fill="#34d399">Common_IV ⊕ (ID_len | ID | PIV)</tspan></text>
  </g>

  <!-- CoAP Message Mapping -->
  <text x="80" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">CoAP Message Layering:</text>
  <rect x="80" y="540" width="475" height="85" rx="8" fill="#0f172a" stroke="#1e293b" />
  <text x="95" y="565" font-family="monospace" font-size="12" fill="#38bdf8">Class U (Outer): POST / (Option 9: OSCORE)</text>
  <text x="95" y="588" font-family="monospace" font-size="12" fill="#a78bfa">Class E (Inner Encrypted): POST /telemetry/grid/voltage</text>
  <text x="95" y="610" font-family="monospace" font-size="11" fill="#10b981">✓ End-to-end payload &amp; URI privacy across cloud proxies</text>


  <!-- Right Card: Option 9 Codec & Normative Auditor -->
  <rect x="615" y="150" width="535" height="500" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="645" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Option 9 Dissector &amp; Normative Audit</text>

  <!-- Option 9 Dissector Box -->
  <rect x="645" y="215" width="475" height="135" rx="8" fill="#030712" stroke="#1e293b" />
  <text x="660" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00E5FF">CoAP Option 9 Compressed Wire Byte Stream</text>
  <text x="660" y="265" font-family="monospace" font-size="15" font-weight="700" fill="#facc15">19 08 37 cb f3 21 00 17 a2 d3 05 01</text>
  <line x1="660" y1="280" x2="1100" y2="280" stroke="#1e293b" stroke-width="1" />
  <text x="660" y="302" font-family="monospace" font-size="11" fill="#94a3b8">Byte 0 [0x19]: Flags (h=1 Kid Context, k=1 Kid, n=1 PIV Len)</text>
  <text x="660" y="322" font-family="monospace" font-size="11" fill="#94a3b8">Byte 1-9 [08 37...]: Kid Context Length (8) + ID Context</text>
  <text x="660" y="340" font-family="monospace" font-size="11" fill="#94a3b8">Byte 10 [0x05]: PIV (Seq 5) | Byte 11 [0x01]: Kid (Sender 01)</text>

  <!-- 10-Point Audit Results -->
  <text x="645" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">10-Point Normative Zero-Trust Compliance:</text>

  <g transform="translate(645, 395)">
    <rect x="0" y="0" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="19" r="8" fill="#10b981" />
    <text x="20" y="23" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Master Secret Entropy &gt;= 128 Bits Verified</text>

    <rect x="0" y="44" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="63" r="8" fill="#10b981" />
    <text x="20" y="67" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Sender &amp; Recipient ID Distinctness Enforced</text>

    <rect x="0" y="88" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="107" r="8" fill="#10b981" />
    <text x="20" y="111" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">COSE AEAD Conformance (RFC 9053 / COSE 10)</text>

    <rect x="0" y="132" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="151" r="8" fill="#10b981" />
    <text x="20" y="155" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Anti-Replay Sliding Window &amp; PIV Monotonicity</text>

    <rect x="0" y="176" width="475" height="38" rx="6" fill="#064e3b" fill-opacity="0.25" stroke="#059669" stroke-width="1" />
    <circle cx="20" cy="195" r="8" fill="#10b981" />
    <text x="20" y="199" font-family="monospace" font-size="11" fill="#022c22" font-weight="bold" text-anchor="middle">✓</text>
    <text x="38" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">Class E Privacy Masking &amp; Wire Budget &lt; 24 Bytes</text>
  </g>
</svg>
